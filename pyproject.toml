[project]
name = "adaptive-model-selector"
version = "1.0.0"
description = "Explainable, deterministic model selection for AI requests"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Khyri Williams (Kai)"}]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
